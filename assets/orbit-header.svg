<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ZenonEl, Backend Engineer and Applied AI</title>
  <desc id="desc">A dark space-themed banner with stars, an astronaut, and orbital lines.</desc>
  <defs>
